version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel_secret
      POSTGRES_DB: fuel_wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fuel -d fuel_wallet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
